name: PdfCraft Android - tests, signed APK and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-update-${{ github.ref }}
  # Do not cancel an in-progress signed publication when another main push lands.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always

jobs:
  rust-tests:
    name: Rust engine and provenance
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: issue55-rust-tests
      - name: Verify pinned upstream engine source
        run: python3 scripts/verify_android_engine_source.py
      - name: Validate owner-reviewed release notes
        run: python3 scripts/verify_android_release_notes.py
      - name: Verify release workflow regression tests
        run: python3 -m unittest discover -s scripts -p 'test_android_release_workflow.py'
      - name: Run Rust tests
        run: cargo test --locked -p pdfcraft-cos -p pdfcraft-create -p pdfcraft-sign -p pdfcraft-js -p pdfcraft-forms -p pdfcraft-xfa -p pdfcraft-engine -p pdfcraft-render -p pdfcraft-android
      - name: Verify native open diagnostics and bounded input reads
        run: |
          cargo test --locked -p pdfcraft-automation --lib input_read_preserves_bytes_and_rejects_oversized_regular_files
          cargo test --locked -p pdfcraft-automation --test native_open_timings open_timings_are_opt_in_and_keep_the_same_document_summary
      - name: Verify native PDF freehand highlighter appearance across reopen
        run: cargo test --locked -p pdfcraft-annot freehand_highlight

  android-tests:
    name: Android JVM and UI tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Rust, cargo-ndk, Android SDK and NDK
        run: |
          rustup toolchain install
          cargo install cargo-ndk --version 4.1.2 --locked
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" >/dev/null
      - uses: Swatinem/rust-cache@v2
        with:
          key: issue55-android-tests
      - name: Run Android JVM unit tests
        working-directory: apps/pdfcraft-android/android
        run: bash "$GITHUB_WORKSPACE/scripts/gradle_with_network_retries.sh" ./gradlew testDebugUnitTest "-Ppdfcraft.abis=arm64-v8a" --no-daemon --stacktrace
      - name: Publish unit test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-unit-test-results
          path: apps/pdfcraft-android/android/app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore

  # Branch protection should require this single non-skippable PR status check.
  # A skipped or failed dependency is a failed merge gate.
  merge-gate:
    name: Merge gate (Rust and Android)
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [rust-tests, android-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Require Rust and Android JVM tests to succeed
        env:
          RUST_RESULT: ${{ needs.rust-tests.result }}
          ANDROID_RESULT: ${{ needs.android-tests.result }}
        run: |
          echo "Rust: $RUST_RESULT; Android JVM: $ANDROID_RESULT"
          if [ "$RUST_RESULT" != success ] || [ "$ANDROID_RESULT" != success ]; then
            echo '::error::PR is not merge-ready: Rust and Android JVM tests must both pass.'
            exit 1
          fi
          echo 'Rust and Android JVM tests passed; APK packaging is verified once per release batch.' >> "$GITHUB_STEP_SUMMARY"

  signed-apk:
    name: Build and verify signed ARM64 APK
    # One-time owner-approved 0.0.18-beta (18012) release on the exact squash-merge commit.
    # Keep manual dispatch for all other batches; normal main pushes never sign.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
      startsWith(github.event.head_commit.message, 'chore(release): publish 0.0.18-beta (18012)')))
    needs: [rust-tests, android-tests]
    permissions:
      contents: write  # publish an already signed and verified APK only from main
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - name: Verify one-time release version and package build number
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          prop=apps/pdfcraft-android/android/gradle.properties
          grep -Fxq 'pdfcraft.version=0.0.18-beta' "$prop"
          grep -Fxq 'pdfcraft.versionCode=1801' "$prop"
          echo 'Exact approved 0.0.18-beta (18012) release properties verified.' >> "$GITHUB_STEP_SUMMARY"
      - name: Require permanent personal signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PDFCRAFT_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PDFCRAFT_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PDFCRAFT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PDFCRAFT_KEY_PASSWORD }}
        run: |
          for secret in "$KEYSTORE_BASE64" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            if [ -z "$secret" ]; then
              echo "::error::Personal signing secrets are missing. Set PDFCRAFT_KEYSTORE_BASE64, PDFCRAFT_KEYSTORE_PASSWORD, PDFCRAFT_KEY_ALIAS and PDFCRAFT_KEY_PASSWORD under Settings > Secrets and variables > Actions. Forks do not inherit upstream secrets."
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          test -s "$RUNNER_TEMP/release.p12"
          chmod 600 "$RUNNER_TEMP/release.p12"
          echo "PDFCRAFT_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify signing passwords, alias and certificate before building
        env:
          PDFCRAFT_KEYSTORE_PASSWORD: ${{ secrets.PDFCRAFT_KEYSTORE_PASSWORD }}
          PDFCRAFT_KEY_ALIAS: ${{ secrets.PDFCRAFT_KEY_ALIAS }}
          PDFCRAFT_KEY_PASSWORD: ${{ secrets.PDFCRAFT_KEY_PASSWORD }}
          PDFCRAFT_CERT_SHA256: ${{ vars.PDFCRAFT_CERT_SHA256 }}
        run: java .github/scripts/VerifyAndroidSigning.java
      - name: Install Rust, cargo-ndk, Android SDK and NDK
        run: |
          rustup toolchain install
          cargo install cargo-ndk --version 4.1.2 --locked
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" >/dev/null
      - uses: Swatinem/rust-cache@v2
        with:
          key: issue55-android-release
      - name: Build signed arm64 APK for owner devices
        working-directory: apps/pdfcraft-android/android
        env:
          PDFCRAFT_KEYSTORE_PASSWORD: ${{ secrets.PDFCRAFT_KEYSTORE_PASSWORD }}
          PDFCRAFT_KEY_ALIAS: ${{ secrets.PDFCRAFT_KEY_ALIAS }}
          PDFCRAFT_KEY_PASSWORD: ${{ secrets.PDFCRAFT_KEY_PASSWORD }}
        run: |
          version="$(sed -n 's/^pdfcraft\.version=//p' gradle.properties)"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          bash "$GITHUB_WORKSPACE/scripts/gradle_with_network_retries.sh" ./gradlew assembleRelease "-Ppdfcraft.abis=arm64-v8a" --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/dist/pdfcraft-android-$version.apk"
      - name: Verify release APK matches validated signing certificate and app ID
        run: |
          tools="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)"
          signer="${tools}apksigner"
          aapt="${tools}aapt"
          for apk in dist/*.apk; do
            "$signer" verify --print-certs "$apk" > "$RUNNER_TEMP/certs.txt"
            expected_cert="${PDFCRAFT_SIGNING_CERT_SHA256:-}"
            if ! [[ "$expected_cert" =~ ^[0-9a-f]{64}$ ]]; then
              echo '::error::Signing preflight did not export a valid certificate fingerprint'
              exit 1
            fi
            grep -qiF "$expected_cert" "$RUNNER_TEMP/certs.txt" || { echo '::error::APK certificate does not match the validated PKCS12 keystore'; exit 1; }
            "$aapt" dump badging "$apk" | grep -q "name='io.github.mohamedref.pdfcraft'" || { echo '::error::Wrong application ID'; exit 1; }
            "$aapt" dump badging "$apk" | grep -q "versionCode='[1-9][0-9]*'" || { echo '::error::Invalid version code'; exit 1; }
          done
      - name: Produce checksum and publish build summary
        run: |
          set -euo pipefail
          apk="$(find dist -maxdepth 1 -name '*.apk' -type f -print -quit)"
          test -n "$apk"
          sha256sum "$apk" > "$apk.sha256"
          {
            echo '## Verified Android release artifact'
            echo "- APK: $(basename "$apk")"
            echo "- SHA-256: $(cut -d' ' -f1 "$apk.sha256")"
            echo "- Signing: owner PKCS12 identity and ARM64 package verified"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload verified signed APK and checksum
        uses: actions/upload-artifact@v7
        with:
          name: pdfcraft-custom-signed-apks
          path: |
            dist/*.apk
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Clean up original signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"


  publish-release:
    name: Publish GitHub Release and update feed
    # Publish only after both test jobs and the signed APK job complete.
    # A signed artifact, not a debug/fallback build, is the only permitted input.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
      startsWith(github.event.head_commit.message, 'chore(release): publish 0.0.18-beta (18012)')))
    needs: [signed-apk]
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Download verified APK from this workflow run
        uses: actions/download-artifact@v7
        with:
          name: pdfcraft-custom-signed-apks
          path: dist
      - name: Verify checksum, manifest and publish curated release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PDFCRAFT_CERT_SHA256: ${{ vars.PDFCRAFT_CERT_SHA256 }}
        run: |
          set -euo pipefail
          version="$(awk -F= '$1=="pdfcraft.version" {print $2; exit}' apps/pdfcraft-android/android/gradle.properties)"
          base_code="$(awk -F= '$1=="pdfcraft.versionCode" {print $2; exit}' apps/pdfcraft-android/android/gradle.properties)"
          tag="v$version"
          apk="dist/pdfcraft-android-$version.apk"
          test -s "$apk" && test -s "$apk.sha256"
          sha256sum -c "$apk.sha256"
          tools="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)"
          "${tools}apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/apk-signer.txt"
          # Cross-job signer pin prevents uploading a substituted artifact.
          python3 scripts/verify_android_apk_certificate.py "$RUNNER_TEMP/apk-signer.txt"
          package_name="$("${tools}aapt" dump badging "$apk" | awk -F"'" '/^package:/ {print $2; exit}')"
          build="$("${tools}aapt" dump badging "$apk" | awk -F"'" '/^package:/ {print $4; exit}')"
          version_name="$("${tools}aapt" dump badging "$apk" | awk -F"'" '/^package:/ {print $6; exit}')"
          expected_build="$((base_code * 10 + 2))"
          test "$package_name" = io.github.mohamedref.pdfcraft
          test "$version_name" = "$version"
          test "$build" = "$expected_build"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Existing $tag is immutable; no duplicate release or replaced APK." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if gh api "repos/$GH_REPO/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "::error::Tag $tag exists without a published release; manual review required."
            exit 1
          fi
          # Keep a complete human-curated summary above the machine-generated PR history.
          notes_file="$RUNNER_TEMP/pdfcraft-release-notes.md"
          curated_notes="docs/releases/$version.md"
          python3 scripts/verify_android_release_notes.py "$curated_notes" "$build"
          cp "$curated_notes" "$notes_file"
          {
            echo
            echo '## Source and verification'
            echo "- Version: $version ($build) (arm64-v8a)."
            echo "- Source: https://github.com/$GH_REPO/commit/$GITHUB_SHA."
            echo "- CI: [run $GITHUB_RUN_ID](https://github.com/$GH_REPO/actions/runs/$GITHUB_RUN_ID), Rust, Android JVM and signed APK verification."
            echo "- SHA-256: $(cut -d' ' -f1 "$apk.sha256")."
          } >> "$notes_file"
          generated="$RUNNER_TEMP/pdfcraft-generated-pr-notes.md"
          gh api -X POST "repos/$GH_REPO/releases/generate-notes" \
            -f tag_name="$tag" -f target_commitish="$GITHUB_SHA" --jq '.body' > "$generated"
          if [ -s "$generated" ]; then
            {
              echo
              echo '## Merged pull requests'
              awk '
                /^## What.s Changed/ { next }
                /^## / { sub(/^## /, "### ") }
                { print }
              ' "$generated"
            } >> "$notes_file"
          fi
          # Tag creation is deliberately last: a failed notes/signing gate leaves no release tag.
          gh api "repos/$GH_REPO/git/refs" -X POST -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" >/dev/null
          args=()
          if [[ "$version" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$tag" --verify-tag --title "PdfCraft $version ($build)" \
            --notes-file "$notes_file" "${args[@]}" "$apk" "$apk.sha256"
          {
            echo "## Published PdfCraft $version ($build)"
            echo "- Signed ARM64 APK: $(basename "$apk")"
            echo "- SHA-256 sidecar: $(basename "$apk.sha256")"
            echo "- [Public release](https://github.com/$GH_REPO/releases/tag/$tag)"
          } >> "$GITHUB_STEP_SUMMARY"
