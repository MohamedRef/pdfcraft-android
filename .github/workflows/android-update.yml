name: PdfCraft Custom - tests and APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-update-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always

jobs:
  rust-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: issue55-rust-tests
      - name: Run Rust tests
        run: cargo test --locked -p pdfcraft-cos -p pdfcraft-engine -p pdfcraft-render -p pdfcraft-android

  android-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Rust, cargo-ndk, Android SDK and NDK
        run: |
          rustup toolchain install
          cargo install cargo-ndk --version 4.1.2 --locked
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" >/dev/null
      - uses: Swatinem/rust-cache@v2
        with:
          key: issue55-android-tests
      - name: Run Android JVM unit tests
        working-directory: apps/pdfcraft-android/android
        run: ./gradlew testDebugUnitTest "-Ppdfcraft.abis=arm64-v8a" --no-daemon --stacktrace
      - name: Publish unit test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-unit-test-results
          path: apps/pdfcraft-android/android/app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore

  # Build the target arm64-v8a APK for S24 Ultra and Galaxy Tab S11 before PR merge.
  # Pull-request code never receives the permanent release signing secrets.
  apk-smoke:
    name: APK smoke (${{ matrix.abi }})
    if: github.event_name == 'pull_request'
    needs: [rust-tests, android-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Rust, cargo-ndk, Android SDK and NDK
        run: |
          rustup toolchain install
          cargo install cargo-ndk --version 4.1.2 --locked
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" >/dev/null
      - uses: Swatinem/rust-cache@v2
        with:
          key: pr-apk-smoke-${{ matrix.abi }}
      - name: Build release-mode APK with temporary CI debug signature
        working-directory: apps/pdfcraft-android/android
        run: ./gradlew assembleRelease "-Ppdfcraft.abis=${{ matrix.abi }}" --no-daemon --stacktrace
      - name: Verify package, signature and compiled Rust library
        working-directory: apps/pdfcraft-android/android
        env:
          ABI: ${{ matrix.abi }}
        run: |
          apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk" || { echo "::error::APK file not produced for $ABI"; exit 1; }
          tools="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)"
          "${tools}apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/apk-certs.txt"
          grep -Eq 'certificate DN:.*CN=Android Debug([,[:space:]]|$)' "$RUNNER_TEMP/apk-certs.txt" || {
            echo "::error::PR smoke APK must have the temporary Android debug signature, not the production signing key"
            exit 1
          }
          "${tools}aapt" dump badging "$apk" > "$RUNNER_TEMP/apk-badging.txt"
          grep -Fq "name='io.github.mohamedref.pdfcraft'" "$RUNNER_TEMP/apk-badging.txt" || {
            echo "::error::Unexpected Android applicationId"
            exit 1
          }
          grep -Eq "versionCode='[1-9][0-9]*'" "$RUNNER_TEMP/apk-badging.txt" || {
            echo "::error::Invalid Android versionCode"
            exit 1
          }
          unzip -Z -1 "$apk" | grep -Fxq "lib/$ABI/libpdfcraft_android.so" || {
            echo "::error::Missing compiled Rust engine for $ABI"
            exit 1
          }
          echo "Release-mode APK for $ABI built, debug-signed and validated (CI only, not distributable)." >> "$GITHUB_STEP_SUMMARY"

  # Branch protection should require this single non-skippable PR status check.
  # A skipped or failed dependency is a failed merge gate.
  merge-gate:
    name: Merge gate (Rust, Android, ABI APKs)
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [rust-tests, android-tests, apk-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Require every PR test and ABI release build to succeed
        env:
          RUST_RESULT: ${{ needs.rust-tests.result }}
          ANDROID_RESULT: ${{ needs.android-tests.result }}
          APK_RESULT: ${{ needs.apk-smoke.result }}
        run: |
          echo "Rust: $RUST_RESULT; Android: $ANDROID_RESULT; APK builds: $APK_RESULT"
          if [ "$RUST_RESULT" != success ] || [ "$ANDROID_RESULT" != success ] || [ "$APK_RESULT" != success ]; then
            echo '::error::PR is not merge-ready: Rust tests, Android tests, and the arm64-v8a APK build must all pass.'
            exit 1
          fi
          echo 'Rust tests, Android unit tests, and the arm64-v8a release APK build passed.' >> "$GITHUB_STEP_SUMMARY"

  signed-apk:
    if: github.event_name != 'pull_request'
    needs: [rust-tests, android-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - name: Require permanent personal signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PDFCRAFT_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PDFCRAFT_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PDFCRAFT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PDFCRAFT_KEY_PASSWORD }}
        run: |
          for secret in "$KEYSTORE_BASE64" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            if [ -z "$secret" ]; then
              echo "::error::Personal signing secrets are missing. Set PDFCRAFT_KEYSTORE_BASE64, PDFCRAFT_KEYSTORE_PASSWORD, PDFCRAFT_KEY_ALIAS and PDFCRAFT_KEY_PASSWORD under Settings > Secrets and variables > Actions. Forks do not inherit upstream secrets."
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          test -s "$RUNNER_TEMP/release.p12"
          chmod 600 "$RUNNER_TEMP/release.p12"
          echo "PDFCRAFT_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify signing passwords, alias and certificate before building
        env:
          PDFCRAFT_KEYSTORE_PASSWORD: ${{ secrets.PDFCRAFT_KEYSTORE_PASSWORD }}
          PDFCRAFT_KEY_ALIAS: ${{ secrets.PDFCRAFT_KEY_ALIAS }}
          PDFCRAFT_KEY_PASSWORD: ${{ secrets.PDFCRAFT_KEY_PASSWORD }}
          PDFCRAFT_CERT_SHA256: ${{ vars.PDFCRAFT_CERT_SHA256 }}
        run: java .github/scripts/VerifyAndroidSigning.java
      - name: Install Rust, cargo-ndk, Android SDK and NDK
        run: |
          rustup toolchain install
          cargo install cargo-ndk --version 4.1.2 --locked
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" >/dev/null
      - uses: Swatinem/rust-cache@v2
        with:
          key: issue55-android-release
      - name: Build signed arm64 APK for owner devices
        working-directory: apps/pdfcraft-android/android
        env:
          PDFCRAFT_KEYSTORE_PASSWORD: ${{ secrets.PDFCRAFT_KEYSTORE_PASSWORD }}
          PDFCRAFT_KEY_ALIAS: ${{ secrets.PDFCRAFT_KEY_ALIAS }}
          PDFCRAFT_KEY_PASSWORD: ${{ secrets.PDFCRAFT_KEY_PASSWORD }}
        run: |
          version="$(sed -n 's/^pdfcraft\.version=//p' gradle.properties)"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          ./gradlew assembleRelease "-Ppdfcraft.abis=arm64-v8a" --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/dist/pdfcraft-custom-$version.apk"
      - name: Verify release APK matches validated signing certificate and app ID
        run: |
          tools="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)"
          signer="${tools}apksigner"
          aapt="${tools}aapt"
          for apk in dist/*.apk; do
            "$signer" verify --print-certs "$apk" > "$RUNNER_TEMP/certs.txt"
            expected_cert="${PDFCRAFT_SIGNING_CERT_SHA256:-}"
            if ! [[ "$expected_cert" =~ ^[0-9a-f]{64}$ ]]; then
              echo '::error::Signing preflight did not export a valid certificate fingerprint'
              exit 1
            fi
            grep -qiF "$expected_cert" "$RUNNER_TEMP/certs.txt" || { echo '::error::APK certificate does not match the validated PKCS12 keystore'; exit 1; }
            "$aapt" dump badging "$apk" | grep -q "name='io.github.mohamedref.pdfcraft'" || { echo '::error::Wrong application ID'; exit 1; }
            "$aapt" dump badging "$apk" | grep -q "versionCode='[1-9][0-9]*'" || { echo '::error::Invalid version code'; exit 1; }
          done
      - name: Upload verified Android update APKs
        uses: actions/upload-artifact@v7
        with:
          name: pdfcraft-custom-signed-apks
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Clean up original signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"
