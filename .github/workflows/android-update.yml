name: PdfCraft Android - tests, signed APK and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Issue #206: every main commit must finish its own checks. With one group per ref, GitHub keeps
# only one pending run per group and cancels the older pending run when a newer push lands, even
# with cancel-in-progress off, so quick back-to-back merges left commits unverified. Main pushes and
# manual runs therefore get a group per commit; only a pull request's superseded runs are cancelled.
# Signing and publishing are serialised separately by the job-level android-publish group below.
concurrency:
  group: >-
    android-update-${{ github.event_name == 'pull_request' && github.ref
    || format('{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always

jobs:
  # Issue #562: a pull request skips the test jobs it cannot affect. scripts/ci_changed_paths.py
  # decides from the changed files; anything it does not know runs everything. Main pushes, manual
  # runs and release pull requests ("chore(release): publish ...") always run every job.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      rust: ${{ steps.paths.outputs.rust }}
      android: ${{ steps.paths.outputs.android }}
    steps:
      - uses: actions/checkout@v7
        with:
          # the merge commit and its base, to list what the pull request changes
          fetch-depth: 2
      - name: Decide which test jobs this change needs
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = pull_request ]; then
            git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed.txt"
          else
            : > "$RUNNER_TEMP/changed.txt"
          fi
          python3 scripts/ci_changed_paths.py "$EVENT" "$TITLE" < "$RUNNER_TEMP/changed.txt" | tee -a "$GITHUB_OUTPUT"
          {
            echo '## Test jobs for this change'
            echo "- Changed files: $(wc -l < "$RUNNER_TEMP/changed.txt")"
            python3 scripts/ci_changed_paths.py "$EVENT" "$TITLE" < "$RUNNER_TEMP/changed.txt" | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"

  # Fast checks with no build: always run.
  repo-checks:
    name: Provenance, release notes and workflow checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Verify pinned upstream engine source
        run: python3 scripts/verify_android_engine_source.py
      - name: Validate owner-reviewed release notes
        run: python3 scripts/verify_android_release_notes.py
      - name: Verify release workflow regression tests
        run: python3 -m unittest discover -s scripts -p 'test_android_release_workflow.py'
      - name: Scan evaluation tool tests
        run: python3 -m unittest discover -s tools/scan-eval -p 'test_*.py'

  rust-tests:
    name: Rust engine tests
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      # Line tables only for the workspace crates (#566): panics still give file:line, the
      # build is about a quarter shorter. Third-party crates already build without debug info.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: issue55-rust-tests
      # pdfcraft-scan's tests take about half the test time, so they run in their own job (#562)
      - name: Compile all Rust test targets except the scanner's
        run: cargo build --locked --tests --keep-going -p pdfcraft-bytes -p pdfcraft-automation -p pdfcraft-cos -p pdfcraft-create -p pdfcraft-sign -p pdfcraft-js -p pdfcraft-forms -p pdfcraft-xfa -p pdfcraft-engine -p pdfcraft-render -p pdfcraft-android
      - name: Run Rust tests except the scanner's
        run: cargo test --locked --no-fail-fast -p pdfcraft-bytes -p pdfcraft-automation -p pdfcraft-cos -p pdfcraft-create -p pdfcraft-sign -p pdfcraft-js -p pdfcraft-forms -p pdfcraft-xfa -p pdfcraft-engine -p pdfcraft-render -p pdfcraft-android

  # The scanner's tests and measuring runner, in parallel with the other Rust jobs (issue #562).
  rust-scan:
    name: Rust scanner tests
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      # Line tables only for the workspace crates (#566): panics still give file:line, the
      # build is about a quarter shorter. Third-party crates already build without debug info.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: issue562-rust-scan
      - name: Compile the scanner's test targets
        run: cargo build --locked --tests -p pdfcraft-scan
      - name: Run the scanner's tests
        run: cargo test --locked --no-fail-fast -p pdfcraft-scan
      - name: Run the scanner's measuring runner on drawn photos (#288)
        run: cargo run --locked -p pdfcraft-scan --features synth --bin scan-eval -- --synthetic 6 --size 600x800

  # The named native checks, in parallel with the workspace tests (issue #562).
  rust-checks:
    name: Rust native checks
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      # Line tables only for the workspace crates (#566): panics still give file:line, the
      # build is about a quarter shorter. Third-party crates already build without debug info.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: issue562-rust-checks
      - name: Verify native open diagnostics and bounded input reads
        run: |
          cargo test --locked -p pdfcraft-automation --lib input_read_preserves_bytes_and_rejects_oversized_regular_files
          cargo test --locked -p pdfcraft-automation --test native_open_timings open_timings_are_opt_in_and_keep_the_same_document_summary
      - name: Verify native PDF freehand highlighter appearance across reopen
        run: cargo test --locked -p pdfcraft-annot freehand_highlight

  android-tests:
    name: Android JVM and UI tests
    needs: [changes]
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          # the merge commit and its base, to tell whether screens changed (#462)
          fetch-depth: 2
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Rust, cargo-ndk, Android SDK and NDK
        run: |
          rustup toolchain install
          cargo install cargo-ndk --version 4.1.2 --locked
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" >/dev/null
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: issue55-android-tests
      - name: Run Android JVM unit tests
        working-directory: apps/pdfcraft-android/android
        run: bash "$GITHUB_WORKSPACE/scripts/gradle_with_network_retries.sh" ./gradlew testDebugUnitTest "-Ppdfcraft.abis=arm64-v8a" --no-daemon --stacktrace
      - name: Check calls against minSdk (Android lint, NewApi only)
        working-directory: apps/pdfcraft-android/android
        run: bash "$GITHUB_WORKSPACE/scripts/gradle_with_network_retries.sh" ./gradlew lintDebug "-Ppdfcraft.abis=arm64-v8a" --no-daemon --stacktrace
      - name: Publish unit test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-unit-test-results
          path: apps/pdfcraft-android/android/app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
      # Pictures of the screens for UI review (#462): only on pull requests that change the UI.
      - name: Check whether screens changed
        id: screens
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -Eq '^apps/pdfcraft-android/android/app/src/(main/java/io/github/artcraftandroid/pdfcraft/ui/|main/res/|test/java/io/github/artcraftandroid/pdfcraft/ui/.*ScreenshotsTest)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Draw screen pictures
        if: steps.screens.outputs.changed == 'true'
        working-directory: apps/pdfcraft-android/android
        run: bash "$GITHUB_WORKSPACE/scripts/gradle_with_network_retries.sh" ./gradlew testDebugUnitTest --tests '*ScreenshotsTest' "-Ppdfcraft.screenshots=true" "-Ppdfcraft.abis=arm64-v8a" --no-daemon --stacktrace
      - name: Publish screen pictures
        if: steps.screens.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: screen-pictures
          path: apps/pdfcraft-android/android/app/build/screenshots/
          if-no-files-found: error

  # Branch protection should require this single non-skippable PR status check.
  # A test job may be skipped only when the Changed paths job said this change does not need it
  # (issue #562); a failed, cancelled or otherwise skipped job fails the gate.
  merge-gate:
    name: Merge gate (Rust and Android)
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [changes, repo-checks, rust-tests, rust-scan, rust-checks, android-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Require every needed test job to succeed
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          REPO_RESULT: ${{ needs.repo-checks.result }}
          RUST_NEEDED: ${{ needs.changes.outputs.rust }}
          RUST_RESULT: ${{ needs.rust-tests.result }}
          RUST_SCAN_RESULT: ${{ needs.rust-scan.result }}
          RUST_CHECKS_RESULT: ${{ needs.rust-checks.result }}
          ANDROID_NEEDED: ${{ needs.changes.outputs.android }}
          ANDROID_RESULT: ${{ needs.android-tests.result }}
        run: |
          echo "Changed paths: $CHANGES_RESULT (Rust needed: $RUST_NEEDED; Android needed: $ANDROID_NEEDED)"
          echo "Repository checks: $REPO_RESULT; Rust tests: $RUST_RESULT; Rust scanner tests: $RUST_SCAN_RESULT; Rust native checks: $RUST_CHECKS_RESULT; Android JVM: $ANDROID_RESULT"
          fail() { echo "::error::PR is not merge-ready: $1"; exit 1; }
          [ "$CHANGES_RESULT" = success ] || fail "the Changed paths job did not succeed."
          [ "$REPO_RESULT" = success ] || fail "repository checks must pass."
          # needed jobs must succeed; a job the change does not need must have been skipped
          check() { # name needed result
            if [ "$2" = true ]; then
              [ "$3" = success ] || fail "$1 must pass."
            elif [ "$2" = false ]; then
              [ "$3" = skipped ] || [ "$3" = success ] || fail "$1 ended $3."
            else
              fail "the Changed paths job gave no answer for $1."
            fi
          }
          check 'Rust engine tests' "$RUST_NEEDED" "$RUST_RESULT"
          check 'Rust scanner tests' "$RUST_NEEDED" "$RUST_SCAN_RESULT"
          check 'Rust native checks' "$RUST_NEEDED" "$RUST_CHECKS_RESULT"
          check 'Android JVM tests' "$ANDROID_NEEDED" "$ANDROID_RESULT"
          {
            echo 'Every test job this change needs passed; APK packaging is verified once per release batch.'
            [ "$RUST_NEEDED" = true ] || echo '- Rust jobs skipped: this change touches no file they build or test.'
            [ "$ANDROID_NEEDED" = true ] || echo '- Android JVM job skipped: this change touches no file it builds or tests.'
          } >> "$GITHUB_STEP_SUMMARY"

  signed-apk:
    name: Build and verify signed ARM64 APK
    # One-time owner-approved 0.0.35-beta (35012) release on the exact squash-merge commit.
    # Keep manual dispatch for all other batches; normal main pushes never sign.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
      startsWith(github.event.head_commit.message, 'chore(release): publish 0.0.35-beta (35012)')))
    needs: [repo-checks, rust-tests, rust-scan, rust-checks, android-tests]
    concurrency:
      # One signed publication at a time across runs; never cancel one in progress.
      group: android-publish
      cancel-in-progress: false
    permissions:
      contents: write  # publish an already signed and verified APK only from main
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - name: Verify one-time release version and package build number
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          prop=apps/pdfcraft-android/android/gradle.properties
          grep -Fxq 'pdfcraft.version=0.0.35-beta' "$prop"
          grep -Fxq 'pdfcraft.versionCode=3501' "$prop"
          echo 'Exact approved 0.0.35-beta (35012) release properties verified.' >> "$GITHUB_STEP_SUMMARY"
      - name: Refuse to re-sign a version that is already tagged
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          version="$(sed -n 's/^pdfcraft\.version=//p' apps/pdfcraft-android/android/gradle.properties)"
          # Published APKs are immutable. A later commit that reuses the one-time release title must
          # not decode the signing key or rebuild with production secrets (issue #111).
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "::error::v$version is already tagged. Bump pdfcraft.version and move the one-time release trigger before publishing again."
            exit 1
          fi
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Rust, cargo-ndk, Android SDK and NDK
        run: |
          rustup toolchain install
          cargo install cargo-ndk --version 4.1.2 --locked
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" >/dev/null
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: issue55-android-release
      # The key is decoded only after the third-party cache action has restored, so it never sees it.
      - name: Require permanent personal signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PDFCRAFT_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PDFCRAFT_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PDFCRAFT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PDFCRAFT_KEY_PASSWORD }}
        run: |
          for secret in "$KEYSTORE_BASE64" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            if [ -z "$secret" ]; then
              echo "::error::Personal signing secrets are missing. Set PDFCRAFT_KEYSTORE_BASE64, PDFCRAFT_KEYSTORE_PASSWORD, PDFCRAFT_KEY_ALIAS and PDFCRAFT_KEY_PASSWORD under Settings > Secrets and variables > Actions. Forks do not inherit upstream secrets."
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          test -s "$RUNNER_TEMP/release.p12"
          chmod 600 "$RUNNER_TEMP/release.p12"
          echo "PDFCRAFT_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
      - name: Verify signing passwords, alias and certificate before building
        env:
          PDFCRAFT_KEYSTORE_PASSWORD: ${{ secrets.PDFCRAFT_KEYSTORE_PASSWORD }}
          PDFCRAFT_KEY_ALIAS: ${{ secrets.PDFCRAFT_KEY_ALIAS }}
          PDFCRAFT_KEY_PASSWORD: ${{ secrets.PDFCRAFT_KEY_PASSWORD }}
          PDFCRAFT_CERT_SHA256: ${{ vars.PDFCRAFT_CERT_SHA256 }}
        run: java .github/scripts/VerifyAndroidSigning.java
      - name: Build signed arm64 APK for owner devices
        working-directory: apps/pdfcraft-android/android
        env:
          PDFCRAFT_KEYSTORE_PASSWORD: ${{ secrets.PDFCRAFT_KEYSTORE_PASSWORD }}
          PDFCRAFT_KEY_ALIAS: ${{ secrets.PDFCRAFT_KEY_ALIAS }}
          PDFCRAFT_KEY_PASSWORD: ${{ secrets.PDFCRAFT_KEY_PASSWORD }}
        run: |
          version="$(sed -n 's/^pdfcraft\.version=//p' gradle.properties)"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          bash "$GITHUB_WORKSPACE/scripts/gradle_with_network_retries.sh" ./gradlew assembleRelease "-Ppdfcraft.abis=arm64-v8a" --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/dist/pdfcraft-android-$version.apk"
      - name: Verify release APK matches validated signing certificate and app ID
        run: |
          tools="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)"
          signer="${tools}apksigner"
          aapt="${tools}aapt"
          for apk in dist/*.apk; do
            "$signer" verify --print-certs "$apk" > "$RUNNER_TEMP/certs.txt"
            expected_cert="${PDFCRAFT_SIGNING_CERT_SHA256:-}"
            if ! [[ "$expected_cert" =~ ^[0-9a-f]{64}$ ]]; then
              echo '::error::Signing preflight did not export a valid certificate fingerprint'
              exit 1
            fi
            grep -qiF "$expected_cert" "$RUNNER_TEMP/certs.txt" || { echo '::error::APK certificate does not match the validated PKCS12 keystore'; exit 1; }
            # Hard pin, also when vars.PDFCRAFT_CERT_SHA256 is unset (issue #106).
            python3 scripts/verify_android_apk_certificate.py "$RUNNER_TEMP/certs.txt"
            "$aapt" dump badging "$apk" | grep -q "name='io.github.mohamedref.pdfcraft'" || { echo '::error::Wrong application ID'; exit 1; }
            "$aapt" dump badging "$apk" | grep -q "versionCode='[1-9][0-9]*'" || { echo '::error::Invalid version code'; exit 1; }
          done
      - name: Produce checksum and publish build summary
        run: |
          set -euo pipefail
          apk="$(find dist -maxdepth 1 -name '*.apk' -type f -print -quit)"
          test -n "$apk"
          sha256sum "$apk" > "$apk.sha256"
          {
            echo '## Verified Android release artifact'
            echo "- APK: $(basename "$apk")"
            echo "- SHA-256: $(cut -d' ' -f1 "$apk.sha256")"
            echo "- Signing: owner PKCS12 identity and ARM64 package verified"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload verified signed APK and checksum
        uses: actions/upload-artifact@v7
        with:
          name: pdfcraft-custom-signed-apks
          path: |
            dist/*.apk
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Clean up original signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"


  publish-release:
    name: Publish GitHub Release and update feed
    # Publish only after every test job and the signed APK job complete.
    # A signed artifact, not a debug/fallback build, is the only permitted input.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
      startsWith(github.event.head_commit.message, 'chore(release): publish 0.0.35-beta (35012)')))
    needs: [signed-apk]
    concurrency:
      # One signed publication at a time across runs; never cancel one in progress.
      group: android-publish
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Download verified APK from this workflow run
        uses: actions/download-artifact@v7
        with:
          name: pdfcraft-custom-signed-apks
          path: dist
      - name: Verify checksum, manifest and publish curated release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PDFCRAFT_CERT_SHA256: ${{ vars.PDFCRAFT_CERT_SHA256 }}
        run: |
          set -euo pipefail
          version="$(awk -F= '$1=="pdfcraft.version" {print $2; exit}' apps/pdfcraft-android/android/gradle.properties)"
          base_code="$(awk -F= '$1=="pdfcraft.versionCode" {print $2; exit}' apps/pdfcraft-android/android/gradle.properties)"
          tag="v$version"
          apk="dist/pdfcraft-android-$version.apk"
          test -s "$apk" && test -s "$apk.sha256"
          sha256sum -c "$apk.sha256"
          tools="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)"
          "${tools}apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/apk-signer.txt"
          # Cross-job signer pin prevents uploading a substituted artifact.
          python3 scripts/verify_android_apk_certificate.py "$RUNNER_TEMP/apk-signer.txt"
          package_name="$("${tools}aapt" dump badging "$apk" | awk -F"'" '/^package:/ {print $2; exit}')"
          build="$("${tools}aapt" dump badging "$apk" | awk -F"'" '/^package:/ {print $4; exit}')"
          version_name="$("${tools}aapt" dump badging "$apk" | awk -F"'" '/^package:/ {print $6; exit}')"
          expected_build="$((base_code * 10 + 2))"
          test "$package_name" = io.github.mohamedref.pdfcraft
          test "$version_name" = "$version"
          test "$build" = "$expected_build"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Existing $tag is immutable; no duplicate release or replaced APK." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if gh api "repos/$GH_REPO/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "::error::Tag $tag exists without a published release; manual review required."
            exit 1
          fi
          # Keep a complete human-curated summary above the machine-generated PR history.
          notes_file="$RUNNER_TEMP/pdfcraft-release-notes.md"
          curated_notes="docs/releases/$version.md"
          python3 scripts/verify_android_release_notes.py "$curated_notes" "$build"
          cp "$curated_notes" "$notes_file"
          {
            echo
            echo '## Source and verification'
            echo "- Version: $version ($build) (arm64-v8a)."
            echo "- Source: https://github.com/$GH_REPO/commit/$GITHUB_SHA."
            echo "- CI: [run $GITHUB_RUN_ID](https://github.com/$GH_REPO/actions/runs/$GITHUB_RUN_ID), Rust, Android JVM and signed APK verification."
            echo "- SHA-256: $(cut -d' ' -f1 "$apk.sha256")."
          } >> "$notes_file"
          generated="$RUNNER_TEMP/pdfcraft-generated-pr-notes.md"
          gh api -X POST "repos/$GH_REPO/releases/generate-notes" \
            -f tag_name="$tag" -f target_commitish="$GITHUB_SHA" --jq '.body' > "$generated"
          if [ -s "$generated" ]; then
            {
              echo
              echo '## Merged pull requests'
              awk '
                /^## What.s Changed/ { next }
                /^## / { sub(/^## /, "### ") }
                { print }
              ' "$generated"
            } >> "$notes_file"
          fi
          # Tag creation is deliberately last: a failed notes/signing gate leaves no release tag.
          gh api "repos/$GH_REPO/git/refs" -X POST -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" >/dev/null
          args=()
          if [[ "$version" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$tag" --verify-tag --title "PdfCraft $version ($build)" \
            --notes-file "$notes_file" "${args[@]}" "$apk" "$apk.sha256"
          {
            echo "## Published PdfCraft $version ($build)"
            echo "- Signed ARM64 APK: $(basename "$apk")"
            echo "- SHA-256 sidecar: $(basename "$apk.sha256")"
            echo "- [Public release](https://github.com/$GH_REPO/releases/tag/$tag)"
          } >> "$GITHUB_STEP_SUMMARY"
