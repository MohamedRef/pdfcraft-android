# Pull request titles follow Conventional Commits (feat: …, fix: …, docs: …, chore: …): a pull
# request is squash-merged and its title becomes the commit on main. This check fails while the
# title doesn't; editing the title re-runs it. It reads only the title, never the pull request's code.
# It runs on pull_request, not pull_request_target: it needs no secrets and no write access, and
# GitHub blocks pull_request_target by default for public repositories (#663).
name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  title:
    name: Conventional title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
