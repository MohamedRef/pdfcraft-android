# Release dry run: a manual run (Actions › Release dry run › Run workflow) builds the arm64-v8a APK
# at the version in gradle.properties, signed with the debug key, and keeps it as the run's artifact.
# It holds no signing secrets and releases nothing.
#
# Publishing has exactly one route: android-update.yml (signed-apk, then publish-release). That route
# runs the Rust and Android tests, pins the signing certificate, checks the manifest versionName and
# versionCode, validates docs/releases/<version>.md and titles the release "PdfCraft <version> (<build>)".
# This workflow used to draft a release on any pushed v* tag and skipped all of that (issue #106), so it
# no longer runs on tags. A hand-pushed tag publishes nothing.
#
# docs/fdroid reads the cargo-ndk version from the "cargo install cargo-ndk" line below: keep it in sync
# with android-update.yml.
name: Release dry run

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-dry-run-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  apk:
    name: APK (debug-signed dry run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - id: v
        name: Resolve version
        run: |
          v="$(sed -n 's/^pdfcraft\.version=//p' apps/pdfcraft-android/android/gradle.properties)"
          if ! printf '%s' "$v" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
            echo "::error::'$v' is not a version like 1.2.3 or 1.2.3-beta"
            exit 1
          fi
          echo "version=$v" >>"$GITHUB_OUTPUT"
          echo "### $v dry run (\`${GITHUB_SHA::9}\`), debug-signed, not for release" >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # the Rust release and targets rust-toolchain.toml names
      - name: Install Rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-android

      - name: Install cargo-ndk and the Android NDK
        run: |
          cargo install cargo-ndk --version 4.1.2 --locked
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" >/dev/null

      - name: Build
        working-directory: apps/pdfcraft-android/android
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          ./gradlew assembleRelease "-Ppdfcraft.abis=arm64-v8a" --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/dist/pdfcraft-android-$VERSION-dry-run-debug-signed.apk"

      - name: APK
        run: |
          tools="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)"
          echo >>"$GITHUB_STEP_SUMMARY"
          for apk in dist/*.apk; do
            build="$("${tools}aapt" dump badging "$apk" | awk -F"'" '/^package:/ {print $4; exit}')"
            {
              echo "    $(basename "$apk") ($build)"
              "${tools}apksigner" verify --print-certs "$apk" | grep "certificate SHA-256" | sed 's/^/      /'
            } >>"$GITHUB_STEP_SUMMARY"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: release-dry-run-apk
          path: dist/*
          if-no-files-found: error
