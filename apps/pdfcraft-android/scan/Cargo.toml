[package]
name = "pdfcraft-scan"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "PdfCraft Android's document scanner: one pass from a camera photo to a straightened, cleaned page image (decode once, encode once)"

[lints]
workspace = true

[features]
# Drawn test photos with exact answers (#288): for the scan-eval runner and the CI gate, never in
# the app. The crate's own tests turn it on by themselves.
synth = ["dep:serde_json"]

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# the page's resolution goes into the PNG (pHYs), which the image crate's encoder cannot write
png = "0.18"
pdfcraft-geom = { workspace = true }
# camera_clean (the looks) stays in the engine until the scan issues replace it (#298, #300)
pdfcraft-engine = { workspace = true }
thiserror = { workspace = true }
# the document detector's model (#290) runs on rten, as the text-recognition models do; the same
# versions as crates/ocr, so nothing new is compiled
rten = { version = "0.26.0", default-features = false, features = ["onnx_format"] }
rten-tensor = "0.26.0"
sha2 = "0.11"
# the scan-eval runner reads test set entries and writes its report (synth feature only)
serde_json = { workspace = true, optional = true }

[dev-dependencies]
# examples/scan_replay.rs reads the page files of scans kept for testing (#288)
serde_json = { workspace = true }

[[bin]]
name = "scan-eval"
required-features = ["synth"]
