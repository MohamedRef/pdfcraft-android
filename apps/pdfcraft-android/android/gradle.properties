org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# The two primary Samsung devices use arm64-v8a. Emulator x86_64 builds must be
# explicitly requested with -Ppdfcraft.abis=x86_64 (no extra ABI in normal APKs).
pdfcraft.abis=arm64-v8a

# The app's version and its version code (before the ABI digit: see app/build.gradle.kts, the build
# checks the two agree). Set both to the release's before tagging it: the release workflow refuses a
# tag that differs, and F-Droid's update check reads them from here.
pdfcraft.version=0.0.29-beta
pdfcraft.versionCode=2901
