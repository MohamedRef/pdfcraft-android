[package]
name = "pdfcraft-android"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "PdfCraft on phones: the engine as a native library with Kotlin bindings (UniFFI); the Android app is in android/"

[lib]
name = "pdfcraft_android"
# cdylib: the library the Android app loads; lib: the tests
crate-type = ["cdylib", "lib"]

[lints]
workspace = true

[dependencies]
pdfcraft-cos = { workspace = true }
# provider files opened in place (#453)
pdfcraft-bytes = { workspace = true }
pdfcraft-engine = { workspace = true }
pdfcraft-render = { workspace = true }
# the headless tool table (the same tools as the CLI and MCP), without the MCP server
pdfcraft-automation = { workspace = true }
# Scan (#287): photo → straightened, cleaned page in one pass, owned by the Android app
pdfcraft-scan = { path = "scan" }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
# MPL-2.0, pure Rust. The exact version: the Kotlin bindings are generated by the same release
# (bindgen/, a workspace member sharing this lock file) and refuse to load against another one.
uniffi = { version = "=0.32.2", default-features = false }
# Page pixels across the FFI in one copy (#86); the only crate here with `unsafe impl`.
pdfcraft-android-ffi-bytes = { path = "ffi-bytes" }

[dev-dependencies]
# test photos for the scan functions
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
pdfcraft-geom = { workspace = true }
# the page-tree walk timed by examples/page_tree_timings.rs (#235)
pdfcraft-annot = { workspace = true }

# the engine's log in logcat (pure Rust; links the system's liblog)
[target.'cfg(target_os = "android")'.dependencies]
android_logger = { version = "0.15", default-features = false }
